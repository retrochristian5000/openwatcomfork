name: WHP OpenWatcom POSIX bootstrap-stage regression

on:
  push:
    paths:
      - ci/buildx.sh
      - cmnvars.sh
      - ci/tests/cmnvars-version.sh
      - ci/tests/buildx-stage.sh
      - .github/workflows/whp-buildx-stage.yml
  pull_request:
    paths:
      - ci/buildx.sh
      - cmnvars.sh
      - ci/tests/cmnvars-version.sh
      - ci/tests/buildx-stage.sh
      - .github/workflows/whp-buildx-stage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - name: POSIX shell syntax
        run: |
          sh -n ci/buildx.sh
          sh -n ci/tests/buildx-stage.sh
          sh -n cmnvars.sh
          sh -n ci/tests/cmnvars-version.sh
      - name: Mocked build stages (no compiler or linker bootstrap)
        run: sh ci/tests/buildx-stage.sh
      - name: Host compiler version preflight (mocked)
        run: sh ci/tests/cmnvars-version.sh
